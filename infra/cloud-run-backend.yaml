apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: regreport-ai-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/regreport-ai-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "development"
            - name: AI_MODE
              value: "mock"
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
